name: CI/CD Pipeline - Build, Test & Staging Deployment

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Build and Unit Tests
        run: mvn clean test

  acceptance-tests:
    needs: build-and-unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Acceptance & Integration Tests (Selenium / Failsafe)
        run: mvn verify -Dtest=*AcceptanceTest*

  deploy-to-staging:
    needs: acceptance-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Simulate Deployment to Staging Environment
        run: |
          echo "=================================================="
          echo "[INFO] Iniciando despliegue en Ambiente de Prueba (Staging)..."
          echo "[INFO] Empaquetando artefacto JAR/WAR..."
          mvn package -DskipTests
          echo "[SUCCESS] Despliegue completado exitosamente en Staging."
          echo "=================================================="

  rollback-strategy:
    needs: deploy-to-staging
    if: failure()fghgh
    runs-on: ubuntu-latest
    steps:
      - name: Execute Automated Rollback
        run: |
          echo "=================================================="
          echo "[ALERTA] Se detectó una falla en el flujo de producción o staging."
          echo "[INFO] Ejecutando rollback a la última versión estable conocida..."
          echo "[SUCCESS] Rollback completado. Sistema restaurado a estado seguro."
          echo "=================================================="
